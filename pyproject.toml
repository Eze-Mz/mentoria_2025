[project]
name = "obesidad-twitter-nlp-portfolio"
version = "0.1.0"
description = "Portfolio de analisis NLP sobre conversaciones de Twitter/X acerca de obesidad en Argentina."
requires-python = ">=3.11,<3.13"
dependencies = [
    "bertopic>=0.16.4",
    "hdbscan>=0.8.40",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=5.22",
    "scikit-learn>=1.5",
    "tabulate>=0.9",
    "umap-learn>=0.5.7",
]

[project.optional-dependencies]
notebooks = [
    "ipykernel>=6.29",
    "jupyter>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
